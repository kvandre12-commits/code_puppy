name: Qualify Candidate (exact SHA)

# Strict qualification of a migration candidate. Unlike the PR "Quality Checks"
# workflow (which tests GitHub's synthetic refs/pull/N/merge commit), this job
# checks out the EXACT candidate commit and proves the artifact under test is
# the one we intend to qualify -- per the "prove the exact artifact" rule in
# patches/BUILD_HOST_QUALIFICATION.md.
#
# Trigger manually and pass the candidate SHA (default: current 0.0.759 candidate).

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Exact commit SHA to qualify (NOT a branch/PR merge)'
        required: true
        default: '50dfe84d'

jobs:
  qualify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.13']
    steps:
      - name: Checkout EXACT candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.candidate_sha }}
          fetch-depth: 0

      - name: PROVE the artifact (fail if HEAD != requested SHA)
        run: |
          want='${{ github.event.inputs.candidate_sha }}'
          got="$(git rev-parse HEAD)"
          echo "requested: $want"
          echo "checked out HEAD: $got"
          case "$got" in
            "$want"*) echo "OK: HEAD matches requested candidate SHA" ;;
            *) echo "FATAL: HEAD ($got) does not match requested candidate ($want) -- refusing to qualify the wrong artifact"; exit 1 ;;
          esac
          # Sanity: this must NOT be a merge commit (PR merge would have 2 parents)
          parents="$(git cat-file -p HEAD | grep -c '^parent ')"
          echo "parent count: $parents"
          if [ "$parents" -gt 1 ]; then
            echo "FATAL: HEAD is a merge commit -- that is the PR-merge trap. Qualify a real candidate commit."; exit 1
          fi

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Dependency resolution (proof 4)
        run: |
          uv venv
          uv sync --all-extras
          uv lock --check || (echo "uv.lock out of date -- regenerate on the candidate and re-publish"; exit 1)

      - name: Import / runtime (proof 5)
        run: |
          uv run python -c "import code_puppy; import code_puppy.config, code_puppy.claude_cache_client, code_puppy.model_factory, code_puppy.agents.base_agent, code_puppy.tools.subagent_invocation, code_puppy.token_usage; print('core imports OK')"
          uv run python -c "import code_puppy.plugins.puppy_kennel.register_callbacks, code_puppy.plugins.droid_viewer.register_callbacks, code_puppy.plugins.bridge_grants.register_callbacks, code_puppy.plugins.ollama.register_callbacks; print('plugin imports OK')"

      - name: Behavioral tests (proof 6)
        env:
          OPENAI_API_KEY: 'fake-key-for-ci-testing'
          ANTHROPIC_API_KEY: 'fake-key-for-ci-testing'
        run: |
          # QUARANTINE (bounded, auditable): exclude ONLY the upstream stale theme
          # test that imports THEMES_PER_PAGE (removed in core-plugins 0.0.15+).
          # code_puppy/ runtime never imports it -> zero runtime impact.
          # See kennel drawer 4657. Remove when upstream restores it / fixes its test.
          uv run pytest tests/ \
            --ignore tests/integration \
            --ignore tests/plugins/test_theme_plugin.py \
            -v --no-cov

      - name: Lint + format (proofs, pinned ruff)
        run: |
          pip install 'ruff>=0.15,<0.16'
          ruff check .
          ruff format --check .
